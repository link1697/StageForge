name: "庄园疑案：审讯室"
case_name: "黑石庄园伯爵命案"
default_language: "zh"
description: "老伯爵在书房被杀，怀表丢失。你在暴风雨夜将嫌疑最大的管家与园丁集中审讯。"
case_brief: "老伯爵在紧锁的书房内被残忍杀害，怀表不翼而飞。暴风雨之夜你已封锁庄园大门，并将嫌疑最大的管家与园丁隔离至审讯室。"
max_rounds: 7
min_accuse_round: 4
culprit_id: "agent_butler"
truth_revealed: >
  真相大白！老伯爵因得知老管家多年中饱私囊而打算将其辞退。老管家怀恨在心，
  利用掌管全屋的钥匙潜入书房，用黄铜烛台重击伯爵头部致其死亡，并将血衣与假账本藏匿在随身的黑布袋中。
  年轻园丁虽然见财起意偷走了金怀表，但进入书房时伯爵早已倒在血泊中。
  老管家企图借刀杀人栽赃园丁，真正的凶手正是老管家！

turn_order:
  - "player"
  - "agent_butler"
  - "agent_gardener"

world_lore:
  - "黑石庄园建于19世纪初，主楼书房位于二楼尽头，窗户外连通着湿滑的玫瑰花坛阳台。"
  - "主楼门窗管理条例严格：每晚10点整由管家统一锁闭整栋洋房，钥匙由管家贴身保管于皮套钥匙扣中。"
  - "暴风雨于昨晚9点开始肆虐，后院温室由于玻璃年久失修，在昨夜11点左右有碎裂声响。"
  - "伯爵生前患有严重高血压，但当晚法医检验表明其真正死因为头部遭纯黄铜重物连续钝击导致颅骨骨折。"

clues:
  - id: "pocket_watch"
    name: "失窃的纯金怀表"
    location: "园丁汤姆随身工装暗袋中"
    detail: "表盖刻有伯爵家族徽章，表面沾有少量泥泞与花泥，停摆时间固定在昨夜11点45分。"
    status: "locked"
    action_prompt: "搜身园丁工装暗袋，查验是否藏有怀表"
    unlock_condition:
      trigger_speaker: "agent_butler"
      keywords: ["金怀表", "偷了怀表", "偷怀表", "暗袋", "工装口袋", "偷走怀表", "手脚不干净偷了表"]

  - id: "black_cloth_bag"
    name: "黑布袋与私账记录"
    location: "老管家房间床底旧木箱暗格"
    detail: "记载了管家近三年虚报庄园修缮费用的真实账本，以及清洗后仍留有血渍的白手套。"
    status: "locked"
    action_prompt: "搜查管家卧房床底木箱暗格，寻找真实账本"
    unlock_condition:
      trigger_speaker: "agent_gardener"
      keywords: ["假账", "做假账", "贪污公款", "中饱私囊", "私账", "虚报账目", "做假账被开除"]

  - id: "brass_candlestick"
    name: "染血的黄铜烛台"
    location: "书房壁炉深处灰烬下"
    detail: "重达2.4公斤，底座凹陷处残留有微量暗红血迹与稀薄的纤维织物碎片。"
    status: "locked"
    action_prompt: "勘验案发书房壁炉灰烬，搜寻击打伯爵的凶器"
    unlock_condition:
      trigger_speaker: "any"
      keywords: ["烛台", "黄铜重物", "重击颅骨", "壁炉灰烬"]

agents:
  - id: "agent_butler"
    name: "理查德"
    role: "庄园总管"
    avatar: "🧐"
    description: "服务庄园40年，滴水不漏，声称案发时在佣人房且绝无钥匙。"
    temperature: 0.5
    system_prompt: >
      你是服务庄园40年的老管家理查德，但实际上你才是杀害伯爵的真正凶手！
      伯爵因查出你多年贪污账目准备辞退你，你怀恨在心，昨晚用私藏钥匙潜入书房，用黄铜烛台杀害了伯爵，并把假账本和凶器藏在黑布袋里。
      你恰好看到园丁溜进书房偷金怀表。
      【言行与心理节奏（必须严格遵守）】：
      1. 【初期阶段（第1-2轮）】：保持绅士风度与极高的伪装！只正面回答侦探提出的具体客观问题（如自己的作息、时间线、巡夜规则等）。
      2. 【中期阶段（第3轮起或被针对逼问时）】：如果侦探怀疑你、或者园丁向你泼脏水，你再适度反击，隐晦或明确指出园丁神色慌张、手脚不干净，甚至揭发他偷了老爷的怀表来转移视线。
      3. 坚决不承认自己有私藏钥匙或动过账本。单次发言100字左右，简短有力。

  - id: "agent_gardener"
    name: "汤姆"
    role: "庄园花匠"
    avatar: "🧑‍🌾"
    description: "脾气暴躁欠有赌债，声称昨夜只是路过，反咬管家怀恨在心。"
    temperature: 0.7
    system_prompt: >
      你是庄园花匠汤姆。你欠了赌债，昨晚确实溜进书房偷了伯爵的金怀表，但你进去时伯爵已经倒在血泊中，你绝对没有杀人！
      你深知杀人偿命，极其害怕被当作凶手。
      【言行与心理节奏（必须严格遵守）】：
      1. 【初期阶段（第1-2轮）】：面对侦探质询，心里发虚但强装镇定。老实回答侦探询问的自己当时在哪里、在做什么（修剪枝叶等）。
         绝不主动招供偷怀表。
      2. 【中期阶段（第3轮起或被管家诬陷时）】：一旦管家当面咬你或者侦探严厉逼问，你脾气暴躁的本性爆发，激烈反击管家，指责管家深夜游荡、钥匙都在管家手里，甚至揭露伯爵曾为账目问题痛骂过管家。
      3. 单次发言在100字左右，口语化、直接。
