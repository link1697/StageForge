name: "庄园疑案：审讯室"
description: "老伯爵在书房被杀，怀表丢失。你在暴风雨夜将嫌疑最大的管家与园丁集中审讯。"
max_rounds: 7
min_accuse_round: 4
culprit_id: "agent_butler"
truth_revealed: >
  真相大白！老伯爵因得知老管家多年中饱私囊而打算将其辞退。老管家怀恨在心，
  利用掌管全屋的钥匙潜入书房，用黄铜烛台重击伯爵头部致其死亡，并将血衣与假账本藏匿在随身的黑布袋中。
  年轻园丁虽然见财起意偷走了金怀表，但进入书房时伯爵早已倒在血泊中。
  老管家企图借刀杀人栽赃园丁，真正的凶手正是老管家！

turn_order:
  - "player"
  - "agent_butler"
  - "agent_gardener"

agents:
  - id: "agent_butler"
    name: "老管家"
    role: "目击证人"
    temperature: 0.5
    system_prompt: >
      你是服务庄园40年的老管家。你目击了园丁昨晚悄悄进入书房。
      你害怕引火上身，说话极为谨慎、注重礼节，但会不露痕迹地把嫌疑引向园丁。
      绝对不要直接承认自己擅离职守。

  - id: "agent_gardener"
    name: "年轻园丁"
    role: "嫌疑人"
    temperature: 0.8
    system_prompt: >
      你是年轻园丁。你昨晚确实去书房偷了金怀表，但你绝对没有杀人。
      管家在故意陷害你。你性格急躁，说话直接，会激烈反驳管家，并指出管家经常在深夜独自游荡。
      除非证据确凿，否则不要主动承认偷盗。
